[schema]
id = "wubi98"
name = "98五笔"
icon_label = "五"
version = "1.0"
author = "zhanlefeng"
description = "五笔98版输入方案"

[engine]
type = "codetable"

# 引擎固定参数。行为、调频、造词、临时拼音等用户可配项在全局 [schema.codetable]，
# 用户也可在设置页给单个方案单独设（落在 schema_overrides/）。
#
# 本段里写的值**优先于全局**，所以内置方案只放引擎必需的参数，其余一律跟随全局，
# 用户在设置页改什么就是什么。第三方方案可以在这里声明用户可配项——那属于方案定义的
# 一部分，用户会看到它标着「方案自带」，取消勾选回到这里写的值而不是全局值。
[engine.codetable]
max_code_length = 4
base_sort = "weight"

[[dictionaries]]
id = "wubi98_main"
label = "98五笔主词库"
description = "基础词库，含单字与高频词组"
path = "wubi98/wubi98.dict.yaml"
type = "rime_codetable"
default = true
base_order = 0

[[dictionaries]]
id = "wubi98_quick_symbols"
label = "快捷符号"
description = "快捷符号"
path = "wubi98/quick_symbols.dict.yaml"
type = "rime_codetable"
default_enabled = true
# 切勿设 default_weight：本库 71 条常用表情共用编码 `emoj`，靠 200/199/198… 递减权重表达
# 展示顺序（😂>🤣>😊…），抹平权重会把这套顺序毁成文件序。其余 199 条恒 100，天然等权。
# base_sort=weight 下同码内按权重降序，该顺序已自动生效，无需额外配置。
base_order = 2

[encoder]
max_word_length = 10

[[encoder.rules]]
length_equal = 2
formula = "AaAbBaBb"

[[encoder.rules]]
length_equal = 3
formula = "AaBaCaCb"

[[encoder.rules]]
length_in_range = [4, 10]
formula = "AaBaCaZa"
